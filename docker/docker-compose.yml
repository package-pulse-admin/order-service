version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: order-platform-mysql
    restart: always
    environment:
      MYSQL_DATABASE: order_platform
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    networks:
      - order-platform-network

  kafka:
    image: apache/kafka:latest
    container_name: order-platform-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # FIXED
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      ALLOW_PLAINTEXT_LISTENER: "yes"

    volumes:
      - kafka_data:/apache/kafka
    networks:
      - order-platform-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: order-platform-kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - order-platform-network

  prometheus:
    image: prom/prometheus:latest
    container_name: order-platform-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - order-platform-network

  grafana:
    image: grafana/grafana:latest
    container_name: order-platform-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - order-platform-network

volumes:
  mysql_data:
  kafka_data:
  grafana_data:

networks:
  order-platform-network:
    driver: bridge